<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כתב יד S027 · סדר הוצאה — המסמך וההערות בזרימה אחת</title>
<meta name="description" content="גוף החיבור והערות המגיב בזרימה אחת — כתב יד S027 (P04577, מקור 797)">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%230f172a"/><text x="32" y="44" font-size="34" text-anchor="middle" fill="%23fbbf24" font-family="serif" font-weight="bold">א</text></svg>'>
<style>
:root{
  --bg:#eef1f6; --ink:#1e293b; --muted:#64748b; --line:#dbe3ee;
  --head:#0f172a; --head2:#1e293b; --accent:#fbbf24;
  --sv1:#22c55e; --sv2:#f59e0b; --sv3:#ef4444;
}
*{box-sizing:border-box}
html{scroll-padding-top:118px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  font-size:16px;line-height:1.6}
button,select{font-family:inherit}
::selection{background:#fde68a}

/* ================= header ================= */
#topbar{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,var(--head),var(--head2));
  color:#fff;box-shadow:0 2px 14px rgba(15,23,42,.35)}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.brand{line-height:1.15;margin-inline-end:4px}
.brand .t1{font-size:15.5px;font-weight:800;white-space:nowrap}
.brand .t1 b{color:var(--accent)}
.brand .t2{font-size:10.5px;color:#94a3b8;white-space:nowrap}
/* view mode segmented */
.seg{display:flex;border:1px solid #334155;border-radius:10px;overflow:hidden;background:#0f172a}
.seg button{border:none;background:transparent;color:#cbd5e1;padding:6px 13px;font-size:12.5px;
  font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button.on{background:#b45309;color:#fff}
.seg button:not(.on):hover{background:#334155}
#ctxSelect{max-width:330px;min-width:0;flex:0 1 330px;background:#1e293b;color:#f1f5f9;
  border:1px solid #334155;border-radius:9px;padding:6px 9px;font-size:13px;cursor:pointer}
.noteNav{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:3px 7px}
.noteNav .nbtn{border:1px solid #334155;background:#0f172a;color:#e2e8f0;border-radius:8px;
  padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.noteNav .nbtn:hover{background:#334155}
#notePos{font-size:11px;color:#cbd5e1;min-width:54px;max-width:230px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:center}
.actions{display:flex;align-items:center;gap:7px;margin-inline-start:auto}
.abtn{border:1px solid #334155;background:#1e293b;color:#e2e8f0;border-radius:9px;
  padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.abtn:hover{background:#334155}
.abtn.primary{background:#b45309;border-color:#d97706}
.abtn.primary:hover{background:#d97706}
.abtn.on{background:#15803d;border-color:#22c55e}
#editBadge{display:none;background:#fbbf24;color:#78350f;border-radius:999px;font-size:10.5px;
  padding:1px 7px;margin-inline-start:4px;font-weight:800}
/* filter row */
.frow{display:flex;align-items:center;gap:6px;padding:6px 16px 8px;overflow-x:auto;flex-wrap:nowrap;
  scrollbar-width:thin}
.flab{font-size:11.5px;color:#94a3b8;font-weight:700;white-space:nowrap;margin-inline-start:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#e2e8f0;
  font-size:11.5px;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
.chip i{width:11px;height:11px;border-radius:4px;background:var(--cb);border:1.5px solid var(--cd);flex:0 0 auto}
.chip b{font-weight:800;color:#cbd5e1;font-size:10.5px}
.chip:hover{background:rgba(255,255,255,.15)}
.chip.off{opacity:.35}
.chip.off i{background:#475569;border-color:#64748b}
.chip.sv{padding:3px 9px}
.chip.sv i{border-radius:50%;background:transparent;border:3px solid var(--cd)}
#allOn{border-style:dashed}
.fsep{width:1px;height:22px;background:rgba(255,255,255,.15);flex:0 0 auto;margin:0 3px}

/* ================= document flow ================= */
#wrap{max-width:940px;margin:0 auto;padding:22px 18px 60px}
#filterNotice{display:none;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;border-radius:10px;
  padding:9px 15px;font-size:13px;margin-bottom:14px;text-align:center}
#loadingBar{display:none;background:#e0f2fe;border:1px solid #38bdf8;color:#075985;border-radius:10px;
  padding:9px 15px;font-size:13px;margin-bottom:14px;text-align:center}

/* part banner (part/book view) */
.partBanner{margin:26px 0 6px;padding:14px 20px;border-radius:12px;background:linear-gradient(135deg,#0f172a,#1e3a5f);
  color:#fff;border:none}
.partBanner .pnum{font-size:11.5px;font-weight:800;color:#fbbf24;letter-spacing:.5px}
.partBanner .ptitle{font-size:20px;font-weight:800;line-height:1.4;margin-top:2px}
.partBanner .pinfo{font-size:12px;color:#cbd5e1;margin-top:4px}
/* chapter header */
.chHead{margin:34px 0 4px;padding:10px 16px 9px;border-inline-start:5px solid #b45309;
  background:#fdf6ec;border:1px solid #f0dfc4;border-inline-start-width:5px;border-radius:8px;
  scroll-margin-top:130px;position:relative}
.chHead .cnum{font-size:11px;font-weight:800;color:#b45309;letter-spacing:.4px}
.chHead .ctitle{font-size:19px;font-weight:800;line-height:1.35;color:#292524}
.chHead .cmeta{font-size:11.5px;color:#a16207;margin-top:2px}
.chHead .jump{position:absolute;inset-inline-start:12px;bottom:8px;font-size:10.5px;color:#b45309;
  cursor:pointer;text-decoration:underline;display:none}

/* body text — NO frame. clean flow. */
.para{position:relative;scroll-margin-top:140px}
.p{font-size:17px;line-height:1.95;margin:0 0 10px;white-space:pre-wrap;overflow-wrap:break-word}
.h1{font-size:25px;font-weight:800;line-height:1.35;margin:30px 0 12px;padding-bottom:8px;border-bottom:2px solid #cbd5e1}
.h2{font-size:22px;font-weight:800;margin:24px 0 11px;line-height:1.4}
.h3{font-size:19px;font-weight:700;margin:20px 0 9px;line-height:1.45;color:#334155}
.h4{font-size:18px;font-weight:700;margin:17px 0 7px;color:#334155}
.h5{font-size:16.5px;font-weight:700;margin:15px 0 6px;color:#475569}
.h6{font-size:15.5px;font-weight:700;margin:13px 0 5px;color:#475569}
.h7{font-size:14.5px;font-weight:600;color:#475569;margin:12px 0 5px}
.sp{height:.8em}
sup.sup{font-size:.72em}

/* anchors in body text */
.ca{padding:0 2px;border-radius:3px;border-bottom:2px dotted var(--a);background:var(--abg);cursor:pointer;transition:box-shadow .12s}
.ca:hover,.ca.hot{box-shadow:0 0 0 2px var(--a)}
.cb{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  margin-inline-start:2px;border-radius:999px;background:var(--a);color:#fff;font-size:10.5px;font-weight:800;
  line-height:1;cursor:pointer;vertical-align:super;transform:translateY(-2px);transition:box-shadow .12s;border:none}
.cb:hover,.cb.hot{box-shadow:0 0 0 2.5px var(--a);filter:brightness(1.1)}
.ca.dim,.cb.dim{opacity:.25}

/* ================= note boxes: bg = TYPE, border-inline = SEVERITY ================= */
.note{background:var(--tbg);border:1px solid rgba(15,23,42,.08);border-inline-start:5px solid var(--sv);
  border-radius:11px;padding:10px 14px 9px;margin:2px 0 14px;scroll-margin-top:145px;position:relative;
  transition:box-shadow .15s}
.note.off{display:none}
.note.hot{box-shadow:0 0 0 3px var(--sv),0 8px 22px rgba(15,23,42,.18)}
.nh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;margin-bottom:6px;
  padding-bottom:6px;border-bottom:1px dashed rgba(15,23,42,.15)}
.nh .tno{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;
  padding:0 5px;border-radius:6px;background:var(--tdark);color:#fff;font-weight:800;font-size:11px}
.nh .tname{font-weight:800;color:var(--tdark);font-size:12px}
.nh .svb{display:inline-flex;align-items:center;gap:5px;border:1.8px solid var(--sv);border-radius:999px;
  padding:1px 9px;font-weight:800;font-size:10.5px;color:var(--svcol)}
.nh .svb i{width:8px;height:8px;border-radius:50%;background:var(--sv)}
.nh .auth{color:#475569;font-weight:600}
.nh .code{font-family:Consolas,monospace;font-size:10.5px;color:#64748b;background:rgba(15,23,42,.06);
  padding:1px 7px;border-radius:5px}
.nh .dt{color:#94a3b8;font-size:10.5px}
.nh .back{margin-inline-start:auto;border:none;background:rgba(15,23,42,.07);color:#475569;border-radius:6px;
  padding:2px 9px;font-size:10.5px;cursor:pointer;font-weight:700}
.nh .back:hover{background:rgba(15,23,42,.15)}
.nb{font-size:14.5px;line-height:1.75;color:#1e293b}
.nb p{margin:0 0 7px}
.nb p:last-child{margin-bottom:0}
.nb .sp{height:.5em}
.nb b{color:#0f172a}

/* edited paragraph markers */
.para.dirty{outline:2px dashed #f59e0b;outline-offset:3px;border-radius:4px}
.para.dirty::after{content:"נערך";position:absolute;top:-9px;inset-inline-start:8px;background:#f59e0b;
  color:#fff;font-size:9.5px;font-weight:800;padding:1px 8px;border-radius:999px;z-index:2}
body.editing .p{cursor:text}
body.editing .para{border-radius:4px}
body.editing .para:hover{background:rgba(251,191,36,.07)}
.revertBtn{display:none;position:absolute;top:-10px;inset-inline-end:8px;z-index:3;border:none;
  background:#dc2626;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 10px;cursor:pointer}
.para.dirty .revertBtn{display:block}
.note.dirtyNote{outline:2px dashed #f59e0b;outline-offset:2px}
.note .nb[contenteditable]{cursor:text}
.note .nb[contenteditable]:hover{background:rgba(255,255,255,.45);border-radius:6px}

#noNotes{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:11px;text-align:center;
  color:var(--muted);font-size:13px;margin-top:10px}

/* ================= stats panel ================= */
#statsPanel{display:none;position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.55);
  overflow:auto;padding:30px 14px}
#statsPanel .card{max-width:760px;margin:0 auto;background:#fff;border-radius:14px;padding:24px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
#statsPanel h2{margin:0 0 4px;font-size:20px}
#statsPanel .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.statsClose{float:left;border:none;background:#e2e8f0;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer}
.stTbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 18px}
.stTbl th,.stTbl td{border:1px solid #e2e8f0;padding:7px 11px;text-align:right}
.stTbl th{background:#f1f5f9;font-size:12px}
.stTbl td.n{font-weight:800}
.tdot{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-inline-start:6px}
.svdot{display:inline-block;width:11px;height:11px;border-radius:50%;border:3px solid var(--c);vertical-align:-1px;margin-inline-start:6px}

/* ================= help ================= */
#helpPanel{display:none;position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.55);overflow:auto;padding:30px 14px}
#helpPanel .card{max-width:640px;margin:0 auto;background:#fff;border-radius:14px;padding:24px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);font-size:14px;line-height:1.8}
#helpPanel h2{margin:0 0 12px;font-size:19px}
#helpPanel ul{margin:0 0 14px;padding-inline-start:20px}
#helpPanel li{margin-bottom:7px}
#helpPanel .legend{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
#helpPanel .legNote{flex:1 1 260px;border-radius:10px;padding:9px 12px;font-size:12.5px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;background:#0f172a;color:#fff;
  border-radius:10px;padding:10px 20px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}

@media (max-width:760px){
  .hrow{padding:7px 10px;gap:7px}
  .brand .t2{display:none}
  #ctxSelect{flex:1 1 150px}
  #doc{padding:20px 14px}
  .p{font-size:15.5px}
  .nb{font-size:13.5px}
}
@media print{
  #topbar,#statsPanel,#helpPanel,#toast,.revertBtn{display:none!important}
  body{background:#fff}
  #wrap{max-width:100%;padding:0}
  .note{break-inside:avoid}
}
</style>
</head>
<body>
<header id="topbar">
  <div class="hrow">
    <div class="brand">
      <div class="t1">כתב יד S027 · <b>סדר הוצאה</b></div>
      <div class="t2">P04577 · מקור 797 — המסמך וההערות בזרימה אחת</div>
    </div>
    <div class="seg" id="viewSeg">
      <button data-v="ch" class="on">פרק</button>
      <button data-v="part">חלק</button>
      <button data-v="book">ספר שלם</button>
    </div>
    <select id="ctxSelect" title="בחירת פרק / חלק"></select>
    <div class="noteNav">
      <button class="nbtn" id="prevNote" title="הערה קודמת">◀ הערה קודמת</button>
      <span id="notePos">—</span>
      <button class="nbtn" id="nextNote" title="הערה הבאה">הערה הבאה ▶</button>
    </div>
    <div class="actions">
      <button class="abtn" id="statsBtn">סטטיסטיקה</button>
      <button class="abtn" id="helpBtn">?</button>
      <button class="abtn" id="editBtn">מצב עריכה</button>
      <button class="abtn primary" id="dlBtn">הורדה<span id="editBadge">0</span></button>
    </div>
  </div>
  <div class="frow" id="filterRow"></div>
</header>

<main id="wrap">
  <div id="filterNotice"></div>
  <div id="loadingBar">טוען נתונים…</div>
  <article id="doc"></article>
</main>

<div id="statsPanel"><div class="card"></div></div>
<div id="helpPanel"><div class="card"></div></div>
<div id="toast"></div>

<script src="chapters/list.js"></script>
<script src="chapters/notes-index.js"></script>
<script>
/* ============================================================
   App: single-flow document + notes
   - view modes: chapter / part / whole book
   - notes inline after their anchor paragraph
   - note bg = type color, border-inline-start = severity color
   - filters by type & severity; prev/next note across chapters
   - edit mode + download (HTML / Word / data.js)
============================================================ */
(function(){
'use strict';

var LIST = window.CHAPTER_LIST || [];
var PARTS = window.PARTS || [];
var META = window.SITE_META || {};
var AMETA = window.ANNOTA_META || {};
var NOTES = window.NOTES_INDEX || [];

var S = {
  view: 'ch',            // 'ch' | 'part' | 'book'
  ch: LIST.length ? LIST[0].id : 'ch01',
  partIdx: 0,
  activeTypes: {},       // code -> true
  activeSvs: {},         // 1/2/3 -> true
  editing: false,
  edits: {},             // chId -> {paraIdx: html, notes: {cid: html}}
  curNoteIdx: -1,
  rendered: [],          // chapter ids currently rendered
  loading: false
};

/* ---------- helpers ---------- */
function $(s, el){ return (el||document).querySelector(s); }
function $$(s, el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function chById(id){ return window.CHAPTER_DATA && window.CHAPTER_DATA[id]; }
function chMeta(id){ for (var i=0;i<LIST.length;i++) if (LIST[i].id===id) return LIST[i]; return null; }
function chNum(id){ var m=/^ch(\d+)$/.exec(id||''); return m?+m[1]:0; }
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(function(){t.classList.remove('show');},2600); }

function partOfCh(id){ var n=chNum(id); for (var i=0;i<PARTS.length;i++)
  if (n>=PARTS[i].from && n<=PARTS[i].to) return i; return 0; }

/* ---------- chapter data loading ---------- */
var loaded = {};
function loadCh(id){
  if (loaded[id] || chById(id)) return Promise.resolve();
  return new Promise(function(res, rej){
    var s=document.createElement('script');
    s.src='chapters/'+id+'.js';
    s.onload=function(){loaded[id]=1;res();};
    s.onerror=function(){rej(new Error('load fail '+id));};
    document.head.appendChild(s);
  });
}
function loadMany(ids, progressCb){
  var BATCH=10, done=0, total=ids.length;
  var out=Promise.resolve();
  for (var b=0; b<ids.length; b+=BATCH){
    (function(batch){
      out = out.then(function(){
        return Promise.all(batch.map(function(id){ return loadCh(id).then(function(){
          done++; if(progressCb) progressCb(done,total);
        }); }));
      });
    })(ids.slice(b, b+BATCH));
  }
  return out;
}

/* ---------- init filters ---------- */
function initFilters(){
  var row = $('#filterRow');
  var html = '<span class="flab">סוג ההערה:</span>';
  var types = AMETA.types || {};
  Object.keys(types).forEach(function(code){
    var t=types[code];
    S.activeTypes[code]=true;
    html += '<button class="chip" data-t="'+code+'" style="--cb:'+t.bg+';--cd:'+t.dark+'">'
      + '<i></i>'+esc(t.name)+' <b>'+t.count+'</b></button>';
  });
  html += '<span class="fsep"></span><span class="flab">חומרה:</span>';
  [1,2,3].forEach(function(sv){
    S.activeSvs[sv]=true;
    var col = sv===1?'#22c55e':(sv===2?'#f59e0b':'#ef4444');
    html += '<button class="chip sv" data-sv="'+sv+'" style="--cd:'+col+'">'
      + '<i></i>'+esc((AMETA.svs||{})[sv]||sv)+' <b>'+((AMETA.bySv||{})[sv]||0)+'</b></button>';
  });
  html += '<span class="fsep"></span><button class="chip" id="allOn">הצג הכל</button>';
  row.innerHTML = html;
  row.addEventListener('click', function(e){
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if (!chip) return;
    if (chip.id==='allOn'){
      Object.keys(S.activeTypes).forEach(function(k){S.activeTypes[k]=true;});
      [1,2,3].forEach(function(k){S.activeSvs[k]=true;});
      syncFilterChips(); applyFilters(); return;
    }
    if (chip.dataset.t){
      var code=chip.dataset.t;
      S.activeTypes[code]=!S.activeTypes[code];
    } else if (chip.dataset.sv){
      var sv=+chip.dataset.sv;
      S.activeSvs[sv]=!S.activeSvs[sv];
    }
    syncFilterChips(); applyFilters();
  });
}
function syncFilterChips(){
  $$('#filterRow .chip').forEach(function(c){
    if (c.id==='allOn') return;
    if (c.dataset.t) c.classList.toggle('off', !S.activeTypes[c.dataset.t]);
    else c.classList.toggle('off', !S.activeSvs[+c.dataset.sv]);
  });
}
function noteVisible(t, sv){ return S.activeTypes[t] && S.activeSvs[sv]; }
function applyFilters(){
  var shown=0, total=0;
  $$('#doc .note').forEach(function(n){
    total++;
    var t=n.dataset.t, sv=+n.dataset.sv;
    var vis=noteVisible(t,sv);
    n.classList.toggle('off', !vis);
    if (vis) shown++;
  });
  // dim badges of hidden notes
  $$('#doc .cb').forEach(function(b){
    var cid=b.dataset.c;
    var note=findNoteEl(cid);
    b.classList.toggle('dim', note ? note.classList.contains('off') : false);
  });
  var fn=$('#filterNotice');
  if (shown<total){
    fn.style.display='block';
    fn.textContent='מסנן פעיל: מוצגות '+shown+' מתוך '+total+' הערות בתצוגה הנוכחית';
  } else fn.style.display='none';
  updateNoteNav();
}
function findNoteEl(cid){
  var el=$('#doc .note[data-cid="'+cid+'"]');
  return el;
}

/* ---------- context selector ---------- */
function buildCtxSelect(){
  var sel=$('#ctxSelect');
  if (S.view==='ch'){
    sel.disabled=false;
    sel.innerHTML = LIST.map(function(c){
      return '<option value="'+c.id+'"'+(c.id===S.ch?' selected':'')+'>'
        + c.num+'. '+esc(c.title)+' ('+c.nc+')</option>';
    }).join('');
  } else if (S.view==='part'){
    sel.disabled=false;
    sel.innerHTML = PARTS.map(function(p,i){
      return '<option value="'+i+'"'+(i===S.partIdx?' selected':'')+'>'
        + 'חלק '+(i+1)+': '+esc(p.part)+' ('+p.chapters.length+' פרקים, '+p.nc+' הערות)</option>';
    }).join('');
  } else {
    sel.disabled=true;
    sel.innerHTML='<option>הספר כולו ('+META.totalChapters+' פרקים, '+META.totalComments+' הערות)</option>';
  }
}
$('#ctxSelect').addEventListener('change', function(){
  if (S.view==='ch'){ S.ch=this.value; }
  else if (S.view==='part'){ S.partIdx=+this.value; S.ch=PARTS[S.partIdx].chapters[0]; }
  render();
});

/* ---------- view mode ---------- */
$('#viewSeg').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  var v=b.dataset.v; if(v===S.view) return;
  // keep continuity: set context from current chapter
  if (S.view==='ch'){ S.partIdx=partOfCh(S.ch); }
  S.view=v;
  if (v==='part'){ S.ch=PARTS[S.partIdx].chapters[0]; }
  $$('#viewSeg button').forEach(function(x){x.classList.toggle('on', x===b);});
  buildCtxSelect(); render();
});

/* ---------- rendering ---------- */
function chaptersForView(){
  if (S.view==='ch') return [S.ch];
  if (S.view==='part') return PARTS[S.partIdx].chapters.slice();
  return LIST.map(function(c){return c.id;});
}

function noteBoxHTML(chId, com, forDownload){
  var tmeta=(AMETA.types||{})[com.t]||{name:com.t,bg:'#eee',dark:'#333'};
  var sv=com.sv;
  var svcol = sv===1?'#22c55e':(sv===2?'#f59e0b':'#ef4444');
  var svname=(AMETA.svs||{})[String(sv)]||sv;
  var m=reMatch(/^(מש-\d+|E-\d+)/, stripTags(com.h));
  var code = m ? m[1] : '';
  return '<div class="note" data-cid="'+com.id+'" data-t="'+com.t+'" data-sv="'+sv+'" id="n-'+chId+'-'+com.id+'" '
    + 'style="--tbg:'+tmeta.bg+';--tdark:'+tmeta.dark+';--sv:'+svcol+';--svcol:'+svcol.replace('#22c55e','#15803d').replace('#f59e0b','#b45309').replace('#ef4444','#b91c1c')+'">'
    + '<div class="nh">'
    + '<span class="tno">'+com.n+'</span>'
    + '<span class="tname">'+esc(tmeta.name)+'</span>'
    + '<span class="svb"><i></i>חומרה '+esc(svname)+'</span>'
    + '<span class="auth">'+esc(com.a)+'</span>'
    + (code?'<span class="code">'+esc(code)+'</span>':'')
    + '<span class="dt">'+esc(com.d)+'</span>'
    + (forDownload?'':'<button class="back" data-back="'+chId+'-'+com.id+'">חזור לטקסט ↑</button>')
    + '</div>'
    + '<div class="nb" data-notebody="'+com.id+'"'+((S.editing&&!forDownload)?' contenteditable="true"':'')+'>'+com.h+'</div>'
    + '</div>';
}
function reMatch(re, s){ var m=re.exec(s||''); return m; }
function stripTags(h){ var d=document.createElement('div'); d.innerHTML=h||''; return d.textContent||''; }

function chapterHTML(chId, forDownload){
  var d=chById(chId); if(!d) return '';
  var edits=S.edits[chId]||{};
  var out=[];
  var comMap={};
  d.comments.forEach(function(c){ comMap[c.id]=c; });
  d.paras.forEach(function(p, pi){
    var cls=p.s||'p';
    if (cls==='sp'){ out.push('<div class="para sp" data-pi="'+pi+'"></div>'); return; }
    var h = edits.para && edits.para[pi]!==undefined ? edits.para[pi] : p.h;
    var dirty=(edits.para&&edits.para[pi]!==undefined)?' dirty':'';
    if (S.editing && !forDownload){
      out.push('<div class="para '+cls+dirty+'" data-pi="'+pi+'" contenteditable="true">'
        + h + '<button class="revertBtn" data-revert="'+chId+':'+pi+'">בטל עריכה</button></div>');
    } else {
      out.push('<div class="para '+cls+dirty+'" data-pi="'+pi+'">'+h+'</div>');
    }
    // notes anchored in this paragraph (badge order = document order)
    var cids = extractCids(p.h);
    cids.forEach(function(cid){
      var c=comMap[cid]; if(!c) return;
      var nb = edits.notes && edits.notes[cid]!==undefined ? edits.notes[cid] : c.h;
      var cc = Object.assign({}, c, {h: nb});
      out.push(noteBoxHTML(chId, cc, forDownload));
    });
  });
  return out.join('');
}
function extractCids(html){
  var re=/<sup class="cb" data-c="([^"]+)"/g, out=[], m;
  while ((m=re.exec(html))) if (out.indexOf(m[1])<0) out.push(m[1]);
  return out;
}

function partBannerHTML(p, idx){
  return '<div class="partBanner"><div class="pnum">חלק '+(idx+1)+' מתוך '+PARTS.length+'</div>'
    + '<div class="ptitle">'+esc(p.part)+'</div>'
    + '<div class="pinfo">'+p.chapters.length+' פרקים · '+p.nc+' הערות</div></div>';
}

var renderToken=0;
function render(){
  var token=++renderToken;
  var ids=chaptersForView();
  var lb=$('#loadingBar');
  var need=ids.filter(function(id){ return !chById(id); });
  if (need.length){
    lb.style.display='block';
    lb.textContent='טוען '+need.length+' קובצי פרקים…';
  }
  return loadMany(need, function(d,t){ lb.textContent='טוען קובצי פרקים… '+d+'/'+t; })
  .then(function(){
    if (token!==renderToken) return;
    lb.style.display='none';
    S.rendered=ids;
    var doc=$('#doc');
    var parts=[];
    if (S.view==='part'){
      parts.push(partBannerHTML(PARTS[S.partIdx], S.partIdx));
    } else if (S.view==='book'){
      parts.push('<div style="text-align:center;margin:10px 0 4px;font-size:12px;color:var(--muted)">'
        + esc(META.built||'')+' · '+META.totalChapters+' פרקים · '+META.totalComments+' הערות</div>');
    }
    ids.forEach(function(id){
      var m=chMeta(id); if(!m) return;
      parts.push('<div class="chapterScope" data-ch="'+id+'">');
      parts.push('<div class="chHead" id="ch-'+id+'"><div class="cnum">פרק '+m.num
        +(S.view!=='ch'?' · '+esc(m.part):'')+'</div>'
        +'<div class="ctitle">'+esc(m.title)+'</div>'
        +'<div class="cmeta">'+m.nc+' הערות'+(S.view!=='ch'?' · לחיצה על הכותרת מעבירה לתצוגת פרק':'')+'</div></div>');
      parts.push(chapterHTML(id));
      parts.push('</div>');
    });
    doc.innerHTML=parts.join('');
    bindDocEvents();
    applyFilters();
    if (!ids.length) return;
    // scroll behavior
    var scrollTarget=location.hash && /^#n-/.test(location.hash) ? location.hash.slice(1) : null;
    if (scrollTarget){
      var el=document.getElementById(scrollTarget);
      if (el){ el.scrollIntoView(); flashNote(el); return; }
    }
    if (S._scrollTo){ var el2=document.getElementById(S._scrollTo); if(el2){ el2.scrollIntoView(); flashNote(el2);} S._scrollTo=null; return; }
    window.scrollTo(0,0);
  })
  .catch(function(err){
    lb.style.display='none';
    toast('שגיאת טעינה: '+err.message);
  });
}
function flashNote(el){
  el.classList.add('hot');
  setTimeout(function(){ el.classList.remove('hot'); }, 1800);
}

/* ---------- doc events ---------- */
function bindDocEvents(){
  $$('#doc .cb').forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      var note=findNoteEl(b.dataset.c);
      if (note){ note.scrollIntoView({behavior:'smooth',block:'center'}); flashNote(note); }
    });
  });
  $$('#doc .ca').forEach(function(a){
    a.addEventListener('click', function(ev){
      ev.stopPropagation();
      var cids=(a.dataset.c||'').split(' ');
      var note=findNoteEl(cids[0]);
      if (note){ note.scrollIntoView({behavior:'smooth',block:'center'}); flashNote(note); }
    });
  });
  $$('#doc .back').forEach(function(b){
    b.addEventListener('click', function(){
      var cid=b.dataset.back.split('-').slice(1).join('-');
      var badge=$('#doc .cb[data-c="'+cid+'"]');
      if (badge){ badge.scrollIntoView({behavior:'smooth',block:'center'}); flashNoteEl(badge); }
    });
  });
  $$('#doc .chHead').forEach(function(h){
    h.addEventListener('click', function(){
      if (S.view==='ch') return;
      var id=h.id.replace('ch-','');
      S.ch=id; S.partIdx=partOfCh(id); S.view='ch';
      $$('#viewSeg button').forEach(function(x){x.classList.toggle('on', x.dataset.v==='ch');});
      buildCtxSelect(); render();
    });
  });
  if (S.editing) bindEditing();
}
function flashNoteEl(el){
  el.classList.add('hot');
  setTimeout(function(){ el.classList.remove('hot'); }, 1800);
}

/* ---------- editing ---------- */
function bindEditing(){
  $$('#doc .para[contenteditable]').forEach(function(p){
    p.addEventListener('input', function(){
      var chId=p.closest('.chapterScope').dataset.ch;
      var pi=+p.dataset.pi;
      markEdit(chId, pi, p.innerHTML);
      p.classList.add('dirty');
      updateEditBadge();
    });
    p.addEventListener('blur', function(){
      var chId=p.closest('.chapterScope').dataset.ch;
      var pi=+p.dataset.pi;
      markEdit(chId, pi, p.innerHTML);
      updateEditBadge();
    });
  });
  $$('#doc .nb[contenteditable]').forEach(function(nb){
    nb.addEventListener('input', function(){
      var chId=nb.closest('.chapterScope').dataset.ch;
      var cid=nb.dataset.notebody;
      var note=findNoteEl(cid);
      var orig=null;
      var d=chById(chId);
      if (d) d.comments.forEach(function(c){ if (String(c.id)===String(cid)) orig=c.h; });
      if (nb.innerHTML!==orig){
        if (!S.edits[chId]) S.edits[chId]={para:{},notes:{}};
        S.edits[chId].notes[cid]=nb.innerHTML;
        if (note) note.classList.add('dirtyNote');
      } else if (S.edits[chId] && S.edits[chId].notes && S.edits[chId].notes[cid]!==undefined){
        delete S.edits[chId].notes[cid];
        if (note) note.classList.remove('dirtyNote');
      }
      updateEditBadge();
    });
  });
  $$('#doc .revertBtn').forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      var parts=b.dataset.revert.split(':');
      var chId=parts[0], pi=+parts[1];
      if (S.edits[chId]){
        delete S.edits[chId].para[pi];
        if (!Object.keys(S.edits[chId].para).length && !Object.keys(S.edits[chId].notes||{}).length) delete S.edits[chId];
      }
      render().then(updateEditBadge);
    });
  });
}
function markEdit(chId, pi, html){
  var orig=chById(chId).paras[pi].h;
  if (html===orig){
    if (S.edits[chId] && S.edits[chId].para && S.edits[chId].para[pi]!==undefined){
      delete S.edits[chId].para[pi];
    }
  } else {
    if (!S.edits[chId]) S.edits[chId]={para:{},notes:{}};
    S.edits[chId].para[pi]=html;
  }
}
function updateEditBadge(){
  var n=0;
  Object.keys(S.edits).forEach(function(c){
    n+=Object.keys(S.edits[c].para||{}).length+Object.keys(S.edits[c].notes||{}).length;
  });
  var b=$('#editBadge');
  b.style.display=n?'inline-block':'none';
  b.textContent=n;
}
$('#editBtn').addEventListener('click', function(){
  S.editing=!S.editing;
  this.classList.toggle('on', S.editing);
  document.body.classList.toggle('editing', S.editing);
  if (S.editing) toast('מצב עריכה פעיל: לחיצה על פסקה מאפשרת עריכתה. העריכות נשמרות מקומית וניתן להורידן.');
  else toast('מצב עריכה כבוי');
  render().then(updateEditBadge);
});

/* ---------- note navigation (cross chapter) ---------- */
function visibleNotes(){
  return NOTES.filter(function(n){ return noteVisible(n.t, n.sv); });
}
function updateNoteNav(){
  var vis=visibleNotes();
  var pos=$('#notePos');
  if (S.curNoteIdx>=0){
    var cn=NOTES[S.curNoteIdx];
    var vi=vis.indexOf(cn);
    pos.textContent='הערה '+(vi+1)+'/'+vis.length+(cn?' · פרק '+cn.ch:'');
  } else {
    pos.textContent=vis.length+' הערות';
  }
}
function gotoNote(idx){
  var vis=visibleNotes();
  if (!vis.length) return;
  var i=Math.max(0, Math.min(idx, vis.length-1));
  var n=vis[i];
  var cid=n.cid, chId='ch'+String(n.ch).padStart(2,'0');
  S.curNoteIdx=NOTES.indexOf(n);
  var noteEl=null;
  if (S.rendered.indexOf(chId)>=0){
    noteEl=findNoteEl(cid);
  }
  if (noteEl){
    noteEl.scrollIntoView({behavior:'smooth',block:'center'}); flashNote(noteEl);
    updateNoteNav();
  } else {
    // switch to chapter view at that chapter (lightest), then scroll
    if (S.view==='book'){ S._scrollTo='n-'+chId+'-'+cid; render(); }
    else {
      S.ch=chId; S.view='ch';
      $$('#viewSeg button').forEach(function(x){x.classList.toggle('on', x.dataset.v==='ch');});
      S.partIdx=partOfCh(chId);
      buildCtxSelect();
      S._scrollTo='n-'+chId+'-'+cid;
      render();
    }
  }
}
$('#nextNote').addEventListener('click', function(){
  var vis=visibleNotes();
  if (!vis.length) return;
  var cur = S.curNoteIdx>=0 ? NOTES[S.curNoteIdx] : null;
  var next;
  if (!cur){ next=vis[0]; }
  else {
    var vi=vis.indexOf(cur);
    next = vi>=0 ? vis[(vi+1)%vis.length] : vis[0];
  }
  gotoNote(NOTES.indexOf(next));
});
$('#prevNote').addEventListener('click', function(){
  var vis=visibleNotes();
  if (!vis.length) return;
  var cur = S.curNoteIdx>=0 ? NOTES[S.curNoteIdx] : null;
  var prev;
  if (!cur){ prev=vis[vis.length-1]; }
  else {
    var vi=vis.indexOf(cur);
    prev = vi>=0 ? vis[(vi-1+vis.length)%vis.length] : vis[0];
  }
  gotoNote(NOTES.indexOf(prev));
});
document.addEventListener('keydown', function(e){
  if (e.altKey && e.key==='ArrowLeft'){ e.preventDefault(); $('#nextNote').click(); }
  if (e.altKey && e.key==='ArrowRight'){ e.preventDefault(); $('#prevNote').click(); }
});

/* ---------- download ---------- */
function downloadBlob(content, mime, filename){
  var blob=new Blob([content], {type:mime+';charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},400);
}
function editedChapters(){
  return Object.keys(S.edits).filter(function(id){
    var e=S.edits[id];
    return Object.keys(e.para||{}).length || Object.keys(e.notes||{}).length;
  });
}
function buildStandaloneHTML(){
  var ids=S.rendered.slice();
  var types=AMETA.types||{};
  var css='<style>'
    +'body{font-family:"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;direction:rtl;margin:24px auto;max-width:900px;padding:0 16px;color:#1e293b;line-height:1.7}'
    +'.partBanner{margin:18px 0;padding:12px 18px;border-radius:10px;background:#0f172a;color:#fff}'
    +'.partBanner .ptitle{font-size:19px;font-weight:800}'
    +'.partBanner .pinfo{font-size:12px;color:#cbd5e1}'
    +'.chHead{margin:26px 0 8px;padding:8px 14px;border-inline-start:5px solid #b45309;background:#fdf6ec;border-radius:8px}'
    +'.chHead .ctitle{font-size:18px;font-weight:800}'
    +'.chHead .cmeta{font-size:11.5px;color:#a16207}'
    +'.p{font-size:16.5px;line-height:1.95;margin:0 0 10px;white-space:pre-wrap}'
    +'.h1{font-size:24px;font-weight:800;margin:26px 0 10px;border-bottom:2px solid #cbd5e1;padding-bottom:6px}'
    +'.h2{font-size:21px;font-weight:800;margin:22px 0 9px}.h3{font-size:18px;font-weight:700;margin:18px 0 8px}'
    +'.h4{font-size:17px;font-weight:700;margin:15px 0 6px}.h5{font-size:16px;font-weight:700;margin:13px 0 5px}'
    +'.h6{font-size:15px;font-weight:700;margin:12px 0 4px}.h7{font-size:14px;font-weight:600;color:#475569;margin:11px 0 4px}'
    +'.cb{display:none}.ca{border-bottom:1px dotted #94a3b8}'
    +'.note{background:var(--tbg);border-inline-start:5px solid var(--sv);border-radius:9px;padding:8px 12px;margin:2px 0 12px}'
    +'.note .nh{font-size:11.5px;color:#475569;border-bottom:1px dashed #cbd5e1;padding-bottom:4px;margin-bottom:6px;font-weight:700}'
    +'.note .nb{font-size:14px;line-height:1.7}'
    +'.note .nb p{margin:0 0 6px}'
    +'</style>';
  var body=[];
  if (S.view==='part') body.push('<div class="partBanner"><div class="ptitle">'+esc(PARTS[S.partIdx].part)+'</div><div class="pinfo">'+PARTS[S.partIdx].chapters.length+' פרקים · '+PARTS[S.partIdx].nc+' הערות</div></div>');
  if (S.view==='book') body.push('<h1 style="text-align:center">כתב יד S027 · סדר הוצאה — המסמך וההערות</h1>');
  ids.forEach(function(id){
    var m=chMeta(id), d=chById(id); if(!m||!d) return;
    body.push('<div class="chHead"><div class="ctitle">פרק '+m.num+' · '+esc(m.title)+'</div><div class="cmeta">'+esc(m.part)+' · '+m.nc+' הערות</div></div>');
    body.push(chapterHTML(id));
  });
  return '<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">'
    +'<title>כתב יד S027 — המסמך וההערות</title>'+css+'</head><body>'
    + body.join('') +'</body></html>';
}
function buildWordHTML(){
  var inner=buildStandaloneHTML();
  // extract body content only
  var m=/<body>([\s\S]*)<\/body>/.exec(inner);
  var content=m?m[1]:inner;
  var css=/<style>([\s\S]*?)<\/style>/.exec(inner)[1];
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    +'<head><meta charset="utf-8"><title>document</title>'
    +'<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->'
    +'<style>'+css+'@page{size:A4;margin:2cm} body{direction:rtl}</style></head>'
    +'<body dir="rtl" lang="HE">'+content+'</body></html>';
}
function buildDataJS(){
  // only edited chapters; else current chapter
  var ids=editedChapters();
  if (!ids.length) ids=[S.ch];
  var out=['window.CHAPTER_DATA=window.CHAPTER_DATA||{};'];
  ids.forEach(function(id){
    var d=chById(id); if(!d) return;
    var e=S.edits[id];
    var dd=JSON.parse(JSON.stringify(d));
    if (e && e.para) Object.keys(e.para).forEach(function(pi){ dd.paras[+pi].h=e.para[pi]; });
    if (e && e.notes) dd.comments.forEach(function(c){ if (e.notes[c.id]!==undefined) c.h=e.notes[c.id]; });
    out.push('window.CHAPTER_DATA["'+id+'"]='+JSON.stringify(dd).replace(/</g,'\\u003c')+';');
  });
  return out.join('\n');
}
function viewName(){
  if (S.view==='ch'){ var m=chMeta(S.ch); return 'פרק_'+m.num+'_'+m.title; }
  if (S.view==='part') return 'חלק_'+(S.partIdx+1);
  return 'הספר_כולו';
}
$('#dlBtn').addEventListener('click', function(){
  var ed=editedChapters();
  var what = ed.length ? ('קבצים שנערכו ('+ed.length+')') : 'התצוגה הנוכחית';
  // simple menu
  if (!window._dlMenu || !document.body.contains(window._dlMenu)){
    var menu=document.createElement('div');
    menu.style.cssText='position:fixed;z-index:95;background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:10px;min-width:240px;top:60px;inset-inline-start:50%;transform:translateX(50%)';
    menu.innerHTML='<div style="font-size:12px;color:#64748b;font-weight:800;margin-bottom:7px">הורדה — '+esc(what)+'</div>'
      +'<button class="dlO" data-k="doc" style="display:block;width:100%;text-align:right;border:none;background:#f1f5f9;border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font-weight:700">קובץ Word‏ (.doc) — טקסט + הערות</button>'
      +'<button class="dlO" data-k="html" style="display:block;width:100%;text-align:right;border:none;background:#f1f5f9;border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font-weight:700">קובץ HTML</button>'
      +'<button class="dlO" data-k="js" style="display:block;width:100%;text-align:right;border:none;background:#f1f5f9;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700">קובץ נתונים לאתר‏ (.js)</button>';
    document.body.appendChild(menu);
    window._dlMenu=menu;
    menu.addEventListener('click', function(ev){
      var b=ev.target.closest('.dlO'); if(!b) return;
      var k=b.dataset.k;
      menu.remove(); window._dlMenu=null;
      doDownload(k, ed);
    });
    setTimeout(function(){ document.addEventListener('click', function close(ev){
      if (window._dlMenu && !window._dlMenu.contains(ev.target)){ window._dlMenu.remove(); window._dlMenu=null; document.removeEventListener('click', close);} }); },10);
  } else { window._dlMenu.remove(); window._dlMenu=null; }
});
function doDownload(k, ed){
  var name=viewName().replace(/[\\/:*?"<>|]/g,'_');
  if (k==='doc') downloadBlob(buildWordHTML(),'application/msword',name+'.doc');
  else if (k==='html') downloadBlob(buildStandaloneHTML(),'text/html',name+'.html');
  else if (k==='js'){
    var ids=ed.length?ed:[S.ch];
    if (ids.length===1) downloadBlob(buildDataJS(),'text/javascript','ch'+ids[0].replace('ch','')+'_edit.js');
    else downloadBlob(buildDataJS(),'text/javascript','chapters_edited.js');
  }
  toast('הקובץ הורד');
}

/* ---------- stats ---------- */
$('#statsBtn').addEventListener('click', function(){
  var types=AMETA.types||{};
  var card=$('#statsPanel .card');
  var rows=Object.keys(types).map(function(code){
    var t=types[code];
    var cells=[1,2,3].map(function(sv){
      var n=NOTES.filter(function(x){return x.t===code && x.sv===sv;}).length;
      return '<td>'+n+'</td>';
    }).join('');
    return '<tr><td class="n"><span class="tdot" style="background:'+t.bg+';border:1px solid '+t.dark+'"></span>'+esc(t.name)+'</td>'
      +cells+'<td class="n">'+t.count+'</td></tr>';
  }).join('');
  var svRow=[1,2,3].map(function(sv){
    var col=sv===1?'#22c55e':(sv===2?'#f59e0b':'#ef4444');
    return '<td class="n"><span class="svdot" style="--c:'+col+'"></span>'+esc((AMETA.svs||{})[String(sv)])+'</td>';
  }).join('');
  var authRows=Object.keys(META.authors||{}).map(function(a){
    var x=META.authors[a];
    return '<tr><td>'+esc(a)+'</td><td class="n" style="color:'+x.color+'">'+x.count+'</td></tr>';
  }).join('');
  card.innerHTML='<button class="statsClose">סגור ✕</button>'
    +'<h2>סטטיסטיקת ההערות</h2>'
    +'<div class="sub">'+META.totalComments+' הערות · '+META.totalChapters+' פרקים · עודכן '+esc(META.built||'')+'</div>'
    +'<table class="stTbl"><tr><th>סוג ההערה</th><th>נמוכה</th><th>בינונית</th><th>גבוהה</th><th>סה"כ</th></tr>'
    +rows+'<tr><th>סה"כ לפי חומרה</th>'+svRow+'<td class="n">'+META.totalComments+'</td></tr></table>'
    +'<div class="sub">לפי מחבר:</div>'
    +'<table class="stTbl"><tr><th>מחבר</th><th>הערות</th></tr>'+authRows+'</table>';
  $('#statsPanel').style.display='block';
  $('.statsClose').addEventListener('click', function(){ $('#statsPanel').style.display='none'; });
});
$('#statsPanel').addEventListener('click', function(e){
  if (e.target===this) this.style.display='none';
});

    +'<li><b>תצוגה:</b> פרק בודד, חלק שלם או הספר כולו. בתצוגת חלק/ספר ניתן ללחוץ על כותרת פרק למעבר לתצוגת הפרק.</li>'
    +'<li><b>סינון:</b> לחיצה על אספת סוג או חומרה מסתירה/מציגה את ההערות המתאימות.</li>'
    +'<li><b>ניווט בהערות:</b> הכפתורים "הערה הבאה/קודמת" עוברים בין ההערות לפי סדר המסמך, גם בין פרקים (מקשי קיצור: ‏Alt+←/→).</li>'
    +'<li><b>עריכה והורדה:</b> במצב עריכה ניתן לערוך פסקאות במקום; העריכות נשמרות בדפדפן, וניתן להוריד את הפרקים שנערכו כקובץ Word‏, HTML או קובץ נתונים לאתר.</li>'
    +'<li>לחיצה על מספר הערה בטקסט מגללת להערה, וכפתור "חזור לטקסט" מחזיר למקום העיגון.</li>'
    +'</ul>'
    +'<div style="font-size:12.5px;color:#64748b;margin-bottom:6px">מקרא צבעי סוגי ההערות:</div>'
    +'<div class="legend">'+legend+'</div>';
  $('#helpPanel').style.display='block';
  $('.statsClose', card).addEventListener('click', function(){ $('#helpPanel').style.display='none'; });
});
$('#helpPanel').addEventListener('click', function(e){

});

/* ---------- note visibility observer ---------- */
var observer=new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if (en.isIntersecting){
      var cid=en.target.dataset.cid;
      for (var i=0;i<NOTES.length;i++) if (NOTES[i].cid===cid){ S.curNoteIdx=i; break; }
      updateNoteNav();
    }
  });
},{rootMargin:'-20% 0px -70% 0px'});
function observeNotes(){
  $$('#doc .note').forEach(function(n){ observer.observe(n); });
}

/* patch: observe after render */
var _origRender=render;
render=function(){
  return _origRender().then ? _origRender().then(function(x){ observeNotes(); return x; }) : _origRender();
};

/* ---------- boot ---------- */
(function boot(){
  // hash deep link: #ch=ch05 | #part=2 | #book | #note=cid
  var h=location.hash.replace('#','');
  if (h){
    var kv=h.split('&'), params={};
    kv.forEach(function(p){ var x=p.split('='); params[x[0]]=x[1]; });
    if (params.ch){ S.ch=params.ch; S.partIdx=partOfCh(S.ch); }
    if (params.part!==undefined){ S.partIdx=+params.part; S.view='part'; S.ch=PARTS[S.partIdx].chapters[0];
      $$('#viewSeg button').forEach(function(x){x.classList.toggle('on', x.dataset.v==='part');}); }
    if (params.book){ S.view='book';
      $$('#viewSeg button').forEach(function(x){x.classList.toggle('on', x.dataset.v==='book');}); }
    if (params.note){
      // find and go
      for (var i=0;i<NOTES.length;i++) if (NOTES[i].cid===params.note){
        S.curNoteIdx=i;
        var chId='ch'+String(NOTES[i].ch).padStart(2,'0');
        if (S.view==='ch') S.ch=chId;
        S._scrollTo='n-'+chId+'-'+params.note;
        break;
      }
    }
  }
  initFilters();
  syncFilterChips();
  buildCtxSelect();
  render().then(function(){ observeNotes(); updateNoteNav(); updateEditBadge(); });
})();
})();
</script>
